[package]
name = "nimbus-cosmic-bridge"
version = "0.1.0"
description = "Nimbus+ Cosmic Bridge Desktop Configurator"
authors = ["Nimbus Team"]
edition = "2021"

[lib]
name = "nimbus_cosmic_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serialport = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.5"
